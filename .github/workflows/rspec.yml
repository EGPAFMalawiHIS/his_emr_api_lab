name: RSpec

on:
  push:
    branches: ['**']
  pull_request:
  # Lets publish-gem.yml run the specs before releasing.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      # Read by spec/dummy/config/database.yml
      LAB_DB_HOST: 127.0.0.1
      LAB_DB_PORT: 3306
      LAB_DB_USERNAME: root
      LAB_DB_PASSWORD: root
      # Live push/pull spec against NLIMS. It is skipped when these are not
      # available (e.g. pull requests from forks).
      NLIMS_URL: ${{ secrets.NLIMS_URL }}
      NLIMS_USERNAME: ${{ secrets.NLIMS_USERNAME }}
      NLIMS_PASSWORD: ${{ secrets.NLIMS_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # mysql2 builds against libmysqlclient; the schema is loaded with the mysql CLI.
      - name: Install MySQL client libraries
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev mysql-client

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # db/structure.sql (the host apps' schema) contains stored functions,
      # which MySQL only accepts with binary logging on if this is set.
      - name: Allow stored functions
        run: mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"

      - name: Prepare test database
        run: bundle exec rake app:db:create app:db:schema:load

      - name: Run specs
        run: bundle exec rspec
